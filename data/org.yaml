# Datos de ejemplo. Estructura y empresa ficticias; los nombres son de
# figuras públicas usadas como relleno reconocible, sin relación con sus
# cargos reales.
# Para trabajar con datos reales crea `data/org.local.yaml` (ignorado por git):
# la página lo carga en su lugar si existe.

# Color themes live in themes.yaml (key referenced by each node's `theme` field).

# Org chart tree.
#
# Each node: name, role, func, theme (key into themes above)
#            badge (optional string — "E" renders a grey circle, "NEW" renders an orange pill)
#            emoji (optional string — rendered without background in top-right corner)
#            if both badge and emoji are defined, badge takes precedence
#
# A node may have:
#   members: list of nodes stacked vertically below it (with a short connector line)
#   columns: list of sub-column descriptors rendered side-by-side
#
# A columns entry may omit name/role/func/theme to create an anonymous column
# (only members, no header card). Presence of `name` = there is a header card.

