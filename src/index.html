<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organigrama</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        const saved =
          localStorage.getItem("theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", saved);
        document.documentElement.setAttribute(
          "data-hide-externos",
          localStorage.getItem("hideExternos") === "1" ? "true" : "false",
        );
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__title">
        <span class="site-header__area" id="headerArea"></span>
        <span class="site-header__sep">:</span>
        <span class="site-header__team" id="headerTeam"></span>
      </div>
      <div class="site-header__controls">
        <label class="toggle-switch theme-toggle" title="Cambiar tema">
          <input type="checkbox" id="themeCheck" />
          <span class="toggle-switch__track">
            <span class="toggle-switch__icon theme-toggle__sun">&#9728;</span>
            <span class="toggle-switch__icon theme-toggle__moon">&#9790;</span>
            <span class="toggle-switch__thumb"></span>
          </span>
        </label>
        <label class="toggle-switch externos-toggle" title="Mostrar/ocultar externos">
          <input type="checkbox" id="externosCheck" />
          <span class="toggle-switch__track">
            <span class="toggle-switch__icon externos-toggle__eye">&#128065;</span>
            <span class="toggle-switch__icon externos-toggle__eye-off">&#128584;</span>
            <span class="toggle-switch__thumb"></span>
          </span>
        </label>
      </div>
    </header>

    <script>
      (function () {
        const check = document.getElementById("themeCheck");
        const saved =
          localStorage.getItem("theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        if (saved === "dark") check.checked = true;
        check.addEventListener("change", function () {
          const theme = this.checked ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          localStorage.setItem("theme", theme);
        });
      })();

      (function () {
        const check = document.getElementById("externosCheck");
        const hidden = localStorage.getItem("hideExternos") === "1";
        check.checked = hidden;
        check.addEventListener("change", function () {
          document.documentElement.setAttribute(
            "data-hide-externos",
            this.checked ? "true" : "false",
          );
          localStorage.setItem("hideExternos", this.checked ? "1" : "0");
          // Hiding/showing cards changes column widths, so the connector
          // bars (drawn from the first/last stem's center) need a redraw.
          if (typeof updateConnectorBounds === "function") {
            updateConnectorBounds();
          }
        });
      })();
    </script>

    <div class="oc-wrap" id="oc-wrap"></div>

    <!-- js-yaml: YAML parser, no build step required -->
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
    <script>
      // Inject a <style> block with per-theme CSS custom properties derived from org.yaml.
      // Each .oc-box[data-ct="<theme>"] block sets --t-* variables consumed by styles.css.
      function injectThemeStyles(themes) {
        const lines = [];
        for (const [name, t] of Object.entries(themes)) {
          const borderStyle = t.dashed ? "dashed" : "solid";
          const nameBorder = t.name_border ? "var(--t-border)" : "transparent";
          lines.push(
            `.oc-box[data-ct="${name}"] {`,
            `  --t-hd-bg: ${t.header_bg};`,
            `  --t-hd-text: ${t.header_text};`,
            `  --t-bd-bg: ${t.body_bg};`,
            `  --t-bd-text: ${t.body_text};`,
            `  --t-border: ${t.border};`,
            `  --t-border-style: ${borderStyle};`,
            `  --t-name-border: ${nameBorder};`,
            `}`,
          );
          if (t.dark) {
            const d = t.dark;
            const darkLines = [
              d.header_bg ? `  --t-hd-bg: ${d.header_bg};` : null,
              d.header_text ? `  --t-hd-text: ${d.header_text};` : null,
              d.body_bg ? `  --t-bd-bg: ${d.body_bg};` : null,
              d.body_text ? `  --t-bd-text: ${d.body_text};` : null,
              d.border ? `  --t-border: ${d.border};` : null,
            ].filter(Boolean);
            if (darkLines.length) {
              lines.push(
                `[data-theme="dark"] .oc-box[data-ct="${name}"] {`,
                ...darkLines,
                `}`,
              );
            }
          }
        }
        const style = document.createElement("style");
        style.textContent = lines.join("\n");
        document.head.appendChild(style);
      }

      // Counts direct and total internal (non-external) reports under a node.
      // Anonymous columns (no `name`) aren't people — their children count as
      // if they were this node's own, same as the level-numbering rule above.
      // External reports (badge "E") and their whole subtree are ignored.
      function countReports(node) {
        const childArray = node.columns || node.members || [];
        let direct = 0;
        let total = 0;
        childArray.forEach((child) => {
          if (child.name === undefined) {
            const sub = countReports(child);
            direct += sub.direct;
            total += sub.total;
            return;
          }
          if (child.badge === "E") return;
          direct += 1;
          total += 1;
          total += countReports(child).total;
        });
        return { direct, total };
      }

      // Build a single card element from a node descriptor.
      // `level` is the depth of this node within the org chart (root's explicit
      // "level" tag, incremented by 1 for each generation below it).
      function makeCard(node, level) {
        const box = document.createElement("div");
        box.className = "oc-box";
        box.dataset.ct = node.theme;
        if (node.badge === "E") box.dataset.external = "true";

        if (level !== undefined) {
          const levelBadge = document.createElement("span");
          levelBadge.className = "oc-level";
          levelBadge.textContent = level;
          box.appendChild(levelBadge);
        }

        ["name", "role", "func"].forEach((field) => {
          const el = document.createElement("div");
          el.className = field;
          el.textContent = node[field];
          box.appendChild(el);
        });

        const childArray = node.columns || node.members;
        if (childArray && childArray.length) {
          box.querySelector(".func").classList.add("func--has-reports");
          const { direct, total } = countReports(node);
          const reports = document.createElement("div");
          reports.className = "reports";
          reports.textContent = `${direct}/${total}`;
          box.appendChild(reports);
        }

        if (node.badge) {
          const badge = document.createElement("span");
          badge.className = node.badge === "NEW" ? "badge-new" : "badge-e";
          badge.textContent = node.badge;
          box.appendChild(badge);
        } else if (node.emoji) {
          const emoji = document.createElement("span");
          emoji.className = "badge-emoji";
          emoji.textContent = node.emoji;
          box.appendChild(emoji);
        }

        return box;
      }

      // A `columns` array with a single anonymous entry doesn't fan out to
      // anything — it's a no-op wrapper. Collapse it so its members/columns
      // become the current node's own, avoiding a redundant connector segment.
      function collapseSingleAnonymousWrap(col) {
        while (
          col.columns &&
          col.columns.length === 1 &&
          col.columns[0].name === undefined
        ) {
          const inner = col.columns[0];
          col = { ...col, columns: inner.columns, members: inner.members };
        }
        return col;
      }

      // Build a column element from a column descriptor.
      // A descriptor with `name` renders a header card; without `name` it's anonymous (members only).
      // `level` is this column's depth in the org chart. An anonymous column doesn't
      // represent a real position, so it doesn't consume a level on its own — its
      // members sit at the same level the column itself was assigned.
      function makeColumn(col, level) {
        col = collapseSingleAnonymousWrap(col);
        const column = document.createElement("div");
        column.className = "oc-column";

        const stem = document.createElement("div");
        stem.className = "oc-stem";
        column.appendChild(stem);

        const hasHeader = col.name !== undefined;
        if (hasHeader) {
          column.appendChild(makeCard(col, level));
        }

        const childLevel = hasHeader ? level + 1 : level;

        if (col.columns && col.columns.length) {
          const subCols = document.createElement("div");
          subCols.className = "oc-columns";
          col.columns.forEach((sub) =>
            subCols.appendChild(makeColumn(sub, childLevel)),
          );
          column.appendChild(subCols);
        } else if (col.members && col.members.length) {
          if (hasHeader) {
            const vline = document.createElement("div");
            vline.className = "oc-vline short";
            column.appendChild(vline);
          }

          const MAX_PER_COLUMN = 4;
          if (col.members.length > MAX_PER_COLUMN) {
            // More than 4 dependents: split into as many 4-tall columns as
            // needed and center them under the parent, like a sub-columns row.
            const chunks = [];
            for (let i = 0; i < col.members.length; i += MAX_PER_COLUMN) {
              chunks.push(col.members.slice(i, i + MAX_PER_COLUMN));
            }
            const memberCols = document.createElement("div");
            memberCols.className = "oc-columns";
            chunks.forEach((chunk) =>
              memberCols.appendChild(
                makeColumn({ members: chunk }, childLevel),
              ),
            );
            column.appendChild(memberCols);
          } else {
            const members = document.createElement("div");
            members.className = "oc-members";
            col.members.forEach((m) =>
              members.appendChild(makeCard(m, childLevel)),
            );
            column.appendChild(members);
          }
        }

        return column;
      }

      // Align each horizontal connector to the exact center of the first and last child stems.
      function updateConnectorBounds() {
        document.querySelectorAll(".oc-columns").forEach((cols) => {
          const columns = Array.from(cols.children).filter(
            (el) =>
              el.classList.contains("oc-column") && el.offsetParent !== null,
          );
          if (!columns.length) return;

          const firstStem = columns[0].firstElementChild;
          const lastStem = columns[columns.length - 1].firstElementChild;
          if (!firstStem || !lastStem) return;

          const colsRect = cols.getBoundingClientRect();
          const firstRect = firstStem.getBoundingClientRect();
          const lastRect = lastStem.getBoundingClientRect();

          const left = firstRect.left + firstRect.width / 2 - colsRect.left;
          const right = colsRect.right - (lastRect.left + lastRect.width / 2);

          cols.style.setProperty("--line-left", `${left}px`);
          cols.style.setProperty("--line-right", `${right}px`);
        });
      }

      async function render() {
        const wrap = document.getElementById("oc-wrap");
        let data, themes;

        // org.local.yaml (datos reales, fuera de git y del deploy) tiene
        // prioridad; si no existe se usa org.yaml, la estructura de demo.
        async function fetchOrg() {
          const local = await fetch("../data/org.local.yaml").catch(() => null);
          if (local && local.ok) return local;
          return fetch("../data/org.yaml");
        }

        try {
          const [orgRes, themesRes] = await Promise.all([
            fetchOrg(),
            fetch("../data/themes.yaml"),
          ]);
          if (!orgRes.ok) throw new Error(`HTTP ${orgRes.status}`);
          if (!themesRes.ok) throw new Error(`HTTP ${themesRes.status}`);
          data = jsyaml.load(await orgRes.text());
          themes = jsyaml.load(await themesRes.text()).themes;
        } catch (e) {
          const msg = document.createElement("p");
          msg.className = "oc-error";
          msg.textContent =
            "No se pudo cargar data/org.yaml o data/themes.yaml. Sirve el proyecto desde la raiz con un servidor local.";
          wrap.appendChild(msg);
          return;
        }

        document.title = data.meta.title;
        document.getElementById("headerArea").textContent = data.meta.area;
        document.getElementById("headerTeam").textContent = data.meta.team;

        injectThemeStyles(themes);

        // Root node — "level" in org.yaml is the starting depth for the whole chart.
        const rootLevel = data.root.level;
        const rootNode = document.createElement("div");
        rootNode.className = "oc-node";
        rootNode.appendChild(makeCard(data.root, rootLevel));
        wrap.appendChild(rootNode);

        // Top-level columns
        if (data.root.columns && data.root.columns.length) {
          const cols = document.createElement("div");
          cols.className = "oc-columns";
          data.root.columns.forEach((col) =>
            cols.appendChild(makeColumn(col, rootLevel + 1)),
          );
          wrap.appendChild(cols);
        }

        updateConnectorBounds();
        window.addEventListener("resize", updateConnectorBounds);
      }

      render();
    </script>
  </body>
</html>
